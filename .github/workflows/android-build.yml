name: Mandela Matrix OS - Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: Install Android API 35 Build-Tools
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Determine Project Directory & Ensure Gradle Wrapper
      run: |
        if [ -d "android-app" ]; then
          BUILD_DIR="android-app"
        else
          BUILD_DIR="."
        fi
        echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
        cd $BUILD_DIR
        rm -f gradlew gradlew.bat
        gradle wrapper --gradle-version 8.7
        chmod +x ./gradlew

    - name: Build Debug & Release APK Binaries
      run: |
        cd ${{ env.BUILD_DIR }}
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

    - name: Verify APK Integrity & Print SHA-256 Hashes
      run: |
        echo "=== VERIFYING APK ARTIFACTS ==="
        find ${{ env.BUILD_DIR }}/app/build/outputs/apk/ -name "*.apk" -exec ls -lh {} +
        find ${{ env.BUILD_DIR }}/app/build/outputs/apk/ -name "*.apk" -exec sha256sum {} +

    - name: Upload Release APK Binary
      uses: actions/upload-artifact@v4
      with:
        name: MandelaMatrixOS-Release-APK
        path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/release/*.apk

    - name: Upload Debug APK Binary
      uses: actions/upload-artifact@v4
      with:
        name: MandelaMatrixOS-Debug-APK
        path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk
