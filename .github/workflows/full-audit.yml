name: Full Repository Audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: Whole repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gradle audit and build
        if: ${{ hashFiles('gradlew') != '' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew lint test assembleDebug --continue --stacktrace --console=plain
      - name: Set up Bun
        if: ${{ hashFiles('package.json') != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and verify frontend
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build
      - name: Python syntax audit
        if: ${{ hashFiles('**/*.py') != '' }}
        shell: bash
        run: python -m compileall -q .
      - name: CodeQL security analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python,java-kotlin
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
