# AndroidX is required by the Compose/AndroidX dependency graph.
android.useAndroidX=true

# AGP 8.5.2 is tested through compileSdk 34; project uses compileSdk 35.
# Keep the existing compileSdk 35 configuration while suppressing this known warning.
android.suppressUnsupportedCompileSdk=35

# Keep Gradle/Kotlin builds stable in CI and local environments.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
